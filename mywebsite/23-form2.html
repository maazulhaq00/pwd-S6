<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>

        <input type="text" name="yourcity" list="city">

        <datalist id="city">
            <option value="Karachi">
            <option value="Lahore">
            <option value="Islamabad">
            <option value="Peshawar">
        </datalist><br>

        <label>
            Select your fav color
            <input type="color" name="favcolor" id="">
        </label><br>
        
        <label>
            Your date of birth
            <input type="date" name="dob" id="">
        </label><br>
        <label>
            Select date time
            <input type="datetime-local" name="dt" id="">
        </label><br>
        <label>
            Password
            <input type="password" name="pass" id="" minlength="4" required>
        </label><br>
        <label>
            Upload assignment
            <input type="file" name="assignment-file" id="">
        </label><br>

        <input type="hidden" name="customer_id" value="1yk3" >

        <br>

        <label>
            month of enrollment
            <input type="month" name="enroll" required>
        </label><br>


        <!-- <button>submit</button> -->
         <input type="image" src="https://www.vhv.rs/dpng/d/137-1377324_green-submit-button-png-icon-submit-button-transparent.png" width="100px" height="100px">

         <input type="reset" value="Reset">


    </form>
</body>

</html>
