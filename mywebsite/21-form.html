<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="fullname">Full Name</label>
        <input type="text" placeholder="Enter your name here" name="fullname" id="fullname" /> <br>

        <label for="age">Age</label>
        <input type="number" placeholder="Enter your age here" name="age" id="age" /> <br>

        <label for="email">Email</label>
        <input type="email" placeholder="Enter your email here" name="email" id="email" /> <br>

        <label>
            Contact number
            <input type="number" name="contact">
        </label> 

        <p>Select Gender</p>

        <label>
            <input type="radio" name="gender" value="m" /> Male
        </label>
        <label>
            <input type="radio" name="gender" value="f" /> Female
        </label>

        <p>Choose Hobbies</p>

        <label>
            <input type="checkbox" name="hobby1" value="Reading"> Reading
        </label>
        <label>
            <input type="checkbox" name="hobby2" value="Writing"> Writing
        </label>
        <label>
            <input type="checkbox" name="hobby3" value="Mobile Games"> Mobile Games
        </label>

        <br>
        <!-- <button>Send</button> -->

        <label>
            Select your city
            <select name="city" size="3" multiple>
                <option value="khi">Karachi</option>
                <option value="lhr">Lahore</option>
                <option value="isl" selected>Islamabad</option>
                <option value="que">Quetta</option>
            </select>
        </label><br>

        <label>
            Enter your message <br>
            <textarea name="message" cols="30" rows="4">Hello World</textarea>
        </label><br>

        <input type="submit" value="SUBMIT" >


    </form>
</body>

</html>
